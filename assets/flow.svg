<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 502" width="1040" height="502" role="img" aria-label="PHAiagent 工作链路">
<title>PHAiagent · 一条内容从触发到送达</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="1040" height="502" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="40" y="54" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">一条内容从触发到送达</text>
<text x="40" y="82" font-size="13" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">五段都是可配置的，换一份数据就换一个场景</text>
<rect x="40" y="118" width="160" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="40" y="118" width="160" height="5" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="58" y="150" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">TRIGGER</text>
<text x="58" y="178" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">触发</text>
<text x="58" y="210" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">定时到点</text>
<text x="58" y="233" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">事件 webhook</text>
<text x="58" y="256" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">手动点一下</text>
<line x1="206" y1="202" x2="232" y2="202" stroke="#2563eb" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="238" y="118" width="160" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="238" y="118" width="160" height="5" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="256" y="150" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">INPUTS</text>
<text x="256" y="178" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">取数</text>
<text x="256" y="210" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">本地 CSV / 日志</text>
<text x="256" y="233" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">事件正文</text>
<text x="256" y="256" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">不碰云端账号</text>
<line x1="404" y1="202" x2="430" y2="202" stroke="#2563eb" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="436" y="118" width="160" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="436" y="118" width="160" height="5" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="454" y="150" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">REASONING</text>
<text x="454" y="178" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">判断</text>
<text x="454" y="210" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">算金额、排优先级</text>
<text x="454" y="233" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">判断能否发布</text>
<text x="454" y="256" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">合并归纳</text>
<line x1="602" y1="202" x2="628" y2="202" stroke="#2563eb" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="634" y="118" width="160" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="634" y="118" width="160" height="5" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="652" y="150" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">GATE</text>
<text x="652" y="178" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">把关</text>
<text x="652" y="210" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">没风险不出声</text>
<text x="652" y="233" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">内容命中才推</text>
<text x="652" y="256" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">要发先问你</text>
<line x1="800" y1="202" x2="826" y2="202" stroke="#2563eb" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="832" y="118" width="160" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="832" y="118" width="160" height="5" rx="2" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<text x="850" y="150" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">DELIVER</text>
<text x="850" y="178" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">交付</text>
<text x="850" y="210" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">邮件 · 企微</text>
<text x="850" y="233" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">钉钉 · 飞书</text>
<text x="850" y="256" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">自定义 webhook</text>
<text x="40" y="320" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">底下一直开着的</text>
<rect x="40" y="332" width="106" height="34" rx="17" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="93.0" y="354" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">调度器 30s</text>
<rect x="158" y="332" width="70" height="34" rx="17" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="193.0" y="354" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">运行历史</text>
<rect x="240" y="332" width="70" height="34" rx="17" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="275.0" y="354" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">失败重试</text>
<rect x="322" y="332" width="130" height="34" rx="17" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="387.0" y="354" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">按 TZ 判断日期</text>
<rect x="464" y="332" width="82" height="34" rx="17" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="505.0" y="354" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">待确认队列</text>
<rect x="40" y="394" width="960" height="56" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="62" y="418" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">不申请邮箱、日历、网盘任何 OAuth</text>
<text x="62" y="438" font-size="12" fill="#2563eb" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">只读你放在本机的文件 —— 数据不出机器，每一行都能改</text>
